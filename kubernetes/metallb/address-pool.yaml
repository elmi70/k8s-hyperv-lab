apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kube-lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.77.200-192.168.77.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kube-lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - kube-lab-pool
