apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
    # Each VM has two NICs. Pin Calico to the lab network (kube-lab-net) so it uses the same
    # address as kubelet's node-ip instead of the Default Switch management NIC.
    nodeAddressAutodetectionV4:
      cidrs:
        - 192.168.77.0/24
    ipPools:
      - blockSize: 26
        cidr: 10.244.0.0/16
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()
---
apiVersion: operator.tigera.io/v1
kind: APIServer
metadata:
  name: default
spec: {}
