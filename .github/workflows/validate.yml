name: Validate lab source
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with: { version: latest }
      - name: Packer init
        working-directory: packer
        run: packer init .
      - name: Packer format
        working-directory: packer
        run: packer fmt -check -recursive .
      - name: Packer validate
        working-directory: packer
        run: packer validate .
      - name: Install validation tools
        run: python -m pip install ansible-core yamllint
      - name: YAML lint
        run: yamllint -c .yamllint.yml .
      - name: Ansible syntax
        run: |
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/prerequisites.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/kubernetes-packages.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/install-node-tools.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/preflight.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/bootstrap-cluster.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/install-cni.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/install-metallb.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/install-metrics-server.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/install-traefik.yml
          ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/validate-cluster.yml
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: PowerShell analysis
        shell: pwsh
        run: |
          $results=Invoke-ScriptAnalyzer -Path ./powershell -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if($results){throw "PSScriptAnalyzer found $($results.Count) issue(s)."}
