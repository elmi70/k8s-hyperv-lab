---
# Single source of truth for versions and cluster CIDRs.
# Loaded automatically for every inventory in this directory (hosts.yml and hosts.example.yml).

# Kubernetes: set the exact patch release only. The apt repository minor ("v1.37") is derived.
kubernetes_version: "1.37.1"
kubernetes_minor: "v{{ kubernetes_version.split('.')[:2] | join('.') }}"

# Cluster networking. The Calico pool in kubernetes/calico/installation.yaml must use pod_cidr
# (install-cni.yml asserts this).
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12

# Node tooling
crictl_version: "v1.37.0"
etcd_tools_version: "v3.7.3"

# Add-ons
calico_version: "v3.33.0"
metallb_version: "v0.16.2"
metrics_server_version: "v0.9.1"
local_path_provisioner_version: "v0.0.37"
gateway_api_version: "v1.6.3"
traefik_chart_version: "42.3.1"
helm_version: "v4.3.1"
helm_sha256: "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b"
