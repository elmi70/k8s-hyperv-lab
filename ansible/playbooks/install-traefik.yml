---
- name: Install Gateway API and Traefik
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Install Standard Gateway API CRDs
      ansible.builtin.command: >-
        kubectl apply --server-side --force-conflicts -f
        https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
      changed_when: true
      register: gateway_crds
      retries: 5
      delay: 10
      until: gateway_crds.rc == 0
    - name: Download Helm
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}.tar.gz"
        checksum: "sha256:{{ helm_sha256 }}"
        mode: '0644'
      register: helm_download
      retries: 5
      delay: 10
      until: helm_download is succeeded
    - name: Extract Helm
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}.tar.gz"
        dest: /tmp
        remote_src: true
    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        mode: '0755'
    - name: Add Traefik Helm repository
      ansible.builtin.command: helm repo add traefik https://traefik.github.io/charts --force-update
      changed_when: true
      register: helm_repo_add
      retries: 5
      delay: 10
      until: helm_repo_add.rc == 0
    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: true
      register: helm_repo_update
      retries: 5
      delay: 10
      until: helm_repo_update.rc == 0
    - name: Copy Traefik values
      ansible.builtin.copy:
        src: ../../kubernetes/traefik/values.yaml
        dest: /tmp/traefik-values.yaml
        mode: '0644'
    - name: Install Traefik with Gateway API provider
      ansible.builtin.command: >-
        helm upgrade --install traefik traefik/traefik
        --version {{ traefik_chart_version }}
        --namespace traefik --create-namespace
        --values /tmp/traefik-values.yaml
        --wait --timeout 10m
      changed_when: true
