---
- name: Install Calico CNI
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Require the Calico pool to match the kubeadm pod CIDR
      ansible.builtin.assert:
        that:
          - "('cidr: ' ~ pod_cidr) in lookup('ansible.builtin.file', playbook_dir ~ '/../../kubernetes/calico/installation.yaml')"
        fail_msg: "kubernetes/calico/installation.yaml must use cidr: {{ pod_cidr }} (pod_cidr in ansible/inventory/group_vars/all.yml)"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Install Calico CRDs
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/v3_projectcalico_org.yaml
      changed_when: true
      register: calico_crds
      retries: 5
      delay: 10
      until: calico_crds.rc == 0
    - name: Install Tigera operator
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
      changed_when: true
      register: tigera_operator
      retries: 5
      delay: 10
      until: tigera_operator.rc == 0
    - name: Copy Calico installation
      ansible.builtin.copy:
        src: ../../kubernetes/calico/installation.yaml
        dest: /tmp/calico-installation.yaml
        mode: '0644'
    - name: Apply Calico
      ansible.builtin.command: kubectl apply -f /tmp/calico-installation.yaml
      changed_when: true
    - name: Wait for nodes Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=10m
      changed_when: false
