---
- name: Install Metrics Server
  hosts: control_plane
  become: true
  vars:
    metrics_server_version: "v0.9.1"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Install Metrics Server
      ansible.builtin.command: >-
        kubectl apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
      changed_when: true
    - name: Configure Metrics Server for local kubeadm lab kubelet certificates
      ansible.builtin.command: >-
        kubectl -n kube-system patch deployment metrics-server --type=json
        -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-preferred-address-types=InternalIP,Hostname"}]'
      changed_when: true
    - name: Wait for Metrics Server
      ansible.builtin.command: kubectl -n kube-system rollout status deployment/metrics-server --timeout=5m
      changed_when: false
